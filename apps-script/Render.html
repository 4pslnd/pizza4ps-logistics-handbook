<script>
/* Renders AutoLayout's vertical geometry using the handbook's dg-* classes.
   Lane headers run along the top; the flow reads top-to-bottom underneath.
   Selecting a step only toggles a class on the existing button — it never
   rebuilds the DOM, so the diagram's scroll position never jumps back to
   the top when someone picks a different step. */
(function (root) {
  var NS = 'http://www.w3.org/2000/svg';
  function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

  function render(el, g, opts) {
    opts = opts || {};
    el.innerHTML = '';

    var head = document.createElement('div');
    head.className = 'dg-rail dg-rail--top';
    head.style.width = g.canvas.width + 'px';

    var canvas = document.createElement('div');
    canvas.className = 'dg-canvas';
    canvas.style.width = g.canvas.width + 'px';
    canvas.style.height = g.canvas.height + 'px';

    g.lanes.forEach(function (l) {
      var band = document.createElement('div');
      band.className = 'dg-band dg-band--col';
      band.style.left = l.left + 'px'; band.style.width = l.width + 'px';
      canvas.appendChild(band);
      var lab = document.createElement('div');
      lab.className = 'dg-rail__label dg-rail__label--top';
      lab.style.left = l.left + 'px'; lab.style.width = l.width + 'px';
      lab.innerHTML = '<span>' + esc(l.label).replace(/\n/g, '<br>') + '</span>';
      head.appendChild(lab);
    });

    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('class', 'dg-svg');
    svg.setAttribute('width', g.canvas.width);
    svg.setAttribute('height', g.canvas.height);
    var defs = document.createElementNS(NS, 'defs');
    [['ar', '#9EA0B8'], ['ar-yes', '#2A4728'], ['ar-no', '#BF6B1F']].forEach(function (m) {
      var mk = document.createElementNS(NS, 'marker');
      mk.setAttribute('id', m[0]); mk.setAttribute('markerWidth', '9');
      mk.setAttribute('markerHeight', '9'); mk.setAttribute('refX', '8');
      mk.setAttribute('refY', '3'); mk.setAttribute('orient', 'auto');
      var pa = document.createElementNS(NS, 'path');
      pa.setAttribute('d', 'M0,0 L8,3 L0,6 z'); pa.setAttribute('fill', m[1]);
      mk.appendChild(pa); defs.appendChild(mk);
    });
    svg.appendChild(defs);

    g.connections.forEach(function (c) {
      var kind = c.label === 'Yes' ? 'yes' : (c.label === 'No' ? 'no' : '');
      var pa = document.createElementNS(NS, 'path');
      pa.setAttribute('d', c.path);
      pa.setAttribute('class', 'dg-conn' + (kind ? ' dg-conn--' + kind : ''));
      pa.setAttribute('marker-end', 'url(#' + (kind ? 'ar-' + kind : 'ar') + ')');
      svg.appendChild(pa);
      if (c.label) {
        var t = document.createElementNS(NS, 'text');
        t.setAttribute('x', c.labelPos.x); t.setAttribute('y', c.labelPos.y);
        t.setAttribute('class', 'dg-conn-label dg-conn-label--' + kind);
        t.textContent = c.label; svg.appendChild(t);
      }
    });
    canvas.appendChild(svg);

    var nodeEls = {};
    g.nodes.forEach(function (n) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'dg-node dg-node--' + n.type + (opts.selected === n.id ? ' dg-node--active' : '');
      b.dataset.id = n.id;
      b.style.left = n.x + 'px'; b.style.top = n.y + 'px';
      b.style.width = n.w + 'px'; b.style.height = n.h + 'px';
      b.innerHTML = '<span class="dg-node__label">' + esc(n.label) + '</span>';
      if (opts.onPick) b.onclick = function () { opts.onPick(n.id); };
      canvas.appendChild(b);
      nodeEls[n.id] = b;

      /* working-days badge, corner-mounted so it never disturbs the box's
         own geometry — action/decision steps only, only when set */
      var wd = n.detail && n.detail.workingDays;
      if ((n.type === 'action' || n.type === 'decision') && wd != null && wd !== '') {
        var badge = document.createElement('span');
        badge.className = 'dg-node-badge';
        badge.textContent = wd + 'd';
        badge.style.left = (n.x + n.w - 8) + 'px';
        badge.style.top = (n.y + n.h - 8) + 'px';
        canvas.appendChild(badge);
      }
    });

    var zoom = document.createElement('div');
    zoom.className = 'dg-zoom-layer';
    zoom.appendChild(canvas);

    var scroll = document.createElement('div');
    scroll.className = 'dg-scroll dg-scroll--vert';
    scroll.appendChild(zoom);

    var wrap = document.createElement('div');
    wrap.className = 'dg-wrap dg-wrap--vert';
    wrap.appendChild(head); wrap.appendChild(scroll);
    el.appendChild(wrap);

    var fitScale = 1, curScale = 1;
    function computeFit() { return Math.min(1, Math.max(0.15, wrap.clientWidth / g.canvas.width)); }
    function apply(scale) {
      curScale = scale;
      zoom.style.transform = 'scale(' + scale + ')';
      zoom.style.transformOrigin = 'top left';
      zoom.style.height = (g.canvas.height * scale) + 'px';
      zoom.style.width = (g.canvas.width * scale) + 'px';
      head.style.width = (g.canvas.width * scale) + 'px';
      head.querySelectorAll('.dg-rail__label--top').forEach(function (lab, i) {
        var l = g.lanes[i];
        lab.style.left = (l.left * scale) + 'px';
        lab.style.width = (l.width * scale) + 'px';
        lab.style.fontSize = Math.max(7, 9.5 * scale) + 'px';
      });
    }
    fitScale = computeFit();
    apply(opts.zoom || fitScale);

    return {
      fitScale: fitScale,
      scale: function () { return curScale; },
      setZoom: function (scale) { apply(Math.max(0.15, Math.min(1.6, scale))); },
      fit: function () { fitScale = computeFit(); apply(fitScale); },
      select: function (id) {
        Object.keys(nodeEls).forEach(function (k) { nodeEls[k].classList.toggle('dg-node--active', k === id); });
      }
    };
  }
  root.DiagramRender = { render: render };
})(window);
</script>
